<template>
    <div class="d-flex align-items-center justify-content-center">
        <label class="mr-auto">
            Time :

            <input style="width: 100px;" class="form-control d-inline h-auto text-right"
                   type="number" step="0.001"
                   :id="htmlElementIds.timeRangeDisplayID" :value="time" @input="updateInputTime($event.target.value)">

            <input type="range" :min="minTime" :max="maxTime" :value="time" :id="htmlElementIds.timeRangeID" style="display: none;">
        </label>

        <button @click="restart" data-original-title="Reset back to start"
             class="btn btn-small" :class="{
                    'btn-dark': !light,
                    'btn-light': light
                }">
            &#8617;&#65039; Restart
        </button>

        <button @click="toggleAnimation"
             class="btn btn-small"
             :class="{
                    'btn-dark': !light,
                    'btn-light': light
                }"
             data-original-title="Play / pause animation">
            {{ animated ? "&#9208" : "&#9654" }} Play / Pause
        </button>

        <button @click="toggleBackwards" data-original-title="Play animation backwards"
             class="btn btn-small" :class="{
                    active: backwards,
                    'btn-dark': !light,
                    'btn-light': light
                }">
            &#9664; Backwards
        </button>

        <label class="ml-auto">
            Speed :
            <select class="form-control d-inline w-auto h-auto"
                    :value="defaultSpeed" @change="updateSelectedSpeed($event.target.value)">
                <option v-for="speed in speeds" :key="speed" :value="speed">
                    {{ speed }}x
                </option>
            </select>
        </label>
    </div>
</template>

<script>
    Vue.component("combat-replay-time-management-component", {
        props: ["time", "minTime", "maxTime", "light", "htmlElementIds"],
        template: `${template}`,
        data() {
            return {
                defaultSpeed: 1,
                speeds: [0.125, 0.25, 0.5, 1, 2, 4, 8, 16],
                animated: false,
                backwards: false
            };
        },
        methods: {
            updateTime(value) {
                this.$emit("time-changed", value);
            },
            updateInputTime(value) {
                this.$emit("input-time-changed", value);
            },
            updateSelectedSpeed(value) {
                animator.setSpeed(Number(value));
            },
            restart() {
                animator.restartAnimate();
            },
            toggleAnimation() {
                this.animated = !this.animated;
                animator.toggleAnimate();
            },
            toggleBackwards() {
                this.backwards = !this.backwards;
                animator.toggleBackwards();
            }
        }
    });
</script>
